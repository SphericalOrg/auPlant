[platformio]
core_dir = C:\Users\bfl\.platformio

[env:esp32dev]
platform = platformio/espressif32@^6.1.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.21.3
